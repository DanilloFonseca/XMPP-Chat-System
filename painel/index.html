<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel MQTT</title>
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f5f7; color: #1d1f23; margin: 0; padding: 24px; }
  .card { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 24px;
          box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: #666; margin: 0 0 20px; font-size: .9rem; }
  .status { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: .8rem; background: #eee; }
  .status.on { background: #d6f5dd; color: #11632a; }
  .lampada { display: flex; align-items: center; gap: 16px; margin: 24px 0; font-size: 1.1rem; }
  .lampada input { width: 28px; height: 28px; cursor: pointer; }
  .icone { width: 48px; height: 48px; border-radius: 50%; background: #ccc; transition: .3s; }
  .icone.acesa { background: #ffd23f; box-shadow: 0 0 24px #ffd23f; }
  h2 { font-size: 1rem; margin: 24px 0 8px; }
  #log { font-family: ui-monospace, monospace; font-size: .8rem; background: #1d1f23; color: #c9f7d0;
         padding: 12px; border-radius: 8px; height: 220px; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="card">
  <h1>Painel MQTT</h1>
  <p class="sub">Broker: <code id="url"></code> &nbsp; <span id="status" class="status">desconectado</span></p>

  <label class="lampada">
    <input type="checkbox" id="luz">
    <span class="icone" id="icone"></span>
    <span id="rotulo">Luz desligada</span>
  </label>

  <h2>Mensagens recebidas</h2>
  <div id="log"></div>
</div>

<script>
  const BROKER = "ws://localhost:9001";
  const TOPICO_COMANDO  = "imd0907/painel/luz/set"; 
  const TOPICO_ESTADO   = "imd0907/painel/luz/estado";
  const TOPICO_MENSAGENS = "imd0907/xmpp/mensagens";

  const luz = document.getElementById("luz");
  const icone = document.getElementById("icone");
  const rotulo = document.getElementById("rotulo");
  const statusEl = document.getElementById("status");
  const logEl = document.getElementById("log");
  document.getElementById("url").textContent = BROKER;

  function registrar(texto) {
    const hora = new Date().toLocaleTimeString("pt-BR");
    logEl.textContent += `[${hora}] ${texto}\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  function aplicarEstado(ligado) {
    luz.checked = ligado;
    icone.classList.toggle("acesa", ligado);
    rotulo.textContent = ligado ? "Luz ligada" : "Luz desligada";
  }

  const cliente = mqtt.connect(BROKER, { clientId: "painel-" + Math.random().toString(16).slice(2, 8) });

  cliente.on("connect", () => {
    statusEl.textContent = "conectado";
    statusEl.classList.add("on");
    cliente.subscribe([TOPICO_COMANDO, TOPICO_MENSAGENS]);
    registrar("Conectado ao broker e inscrito nos tópicos.");
  });

  cliente.on("close", () => {
    statusEl.textContent = "desconectado";
    statusEl.classList.remove("on");
  });

  cliente.on("message", (topico, payload) => {
    const texto = payload.toString();
    if (topico === TOPICO_COMANDO) {
      const ligado = texto.toUpperCase() === "ON";
      aplicarEstado(ligado);
      registrar(`Comando recebido: ${texto}`);
      cliente.publish(TOPICO_ESTADO, ligado ? "ON" : "OFF", { qos: 1 });
    } else if (topico === TOPICO_MENSAGENS) {
      try {
        const m = JSON.parse(texto);
        registrar(`${m.de}: ${m.texto}`);
      } catch {
        registrar(texto);
      }
    }
  });

  luz.addEventListener("change", () => {
    aplicarEstado(luz.checked);
    const estado = luz.checked ? "ON" : "OFF";
    cliente.publish(TOPICO_ESTADO, estado, { qos: 1 });
    registrar(`Clique manual -> publicado ${estado} em ${TOPICO_ESTADO}`);
  });
</script>
</body>
</html>
